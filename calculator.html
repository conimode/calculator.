<html>
<head>
        <title> calculator </title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
*{
   margin:0;
   padding:0;
   box-sizing:border-box;
}
body
      {   font-family: "Poppins", sans-serif;
   font-weight: 500;
   width:100%;
   height:100vh;
   display:flex;
   justify-content:center;
   align-items:center;
   background:linear-gradient(60deg,black,grey);
}
.calculator{
   width:400px;
   height:auto;
   border: 2px solid grey;
   padding: 20px;
   border-radius:16px;
   background:transparent;
   box-shadow: 0px 8px 20px rgba(113,115,119,0.6);
   display:grid;
}
input{
   width:100%;
   border:none; 
   padding:24px;
   margin:10px;
   background:transparent;
   box-shadow:0px 8px 20px rgba(84,84,84,0.2);
   font-size:40px;
   text-align:right;
   cursor:pointer;
}
input::placeholder{
   color:white;
}
button{
   border:none;
   width:60px;
   height:60px;
   margin:10px;
   border-radius:50px;
   background:transparent;
   color:white;
   font-size:20px;
   box-shadow:-8px -8px 15px rgba(225,225,225,0.2);
   cursor:pointer;
}
.equalBtn{
   background-color:orange;
}
.equal{
   background-color:grey;
   color:black;
}
.credit{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:11px;
  color:black;
  font-family:monospace;
}  
</style>
<body>
  <div class="credit"> code by code traversal </div>
  <div class="calculator">
       <input type="text" placeholder="0" id="inputbox">

       <div>
            <button class="equal">AC</button>
            <button class="equal">DEL</button>
            <button class="equal">%</button>
            <button class="equalBtn">/</button>
       </div>
      
       <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="equalBtn">*</button>
       </div>

       <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="equalBtn">-</button>
       </div>

       <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="equalBtn">+</button>
       </div>

       <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
       </div>
</div>

<script>
       let input = document.getElementById('inputbox');
       let buttons= document.querySelectorAll('button');

       let string="";
       let arr=Array.from(buttons);
       arr.forEach(button=> {
           button.addEventListener("click",(e)=>{
             if(e.target.innerHTML == "="){
               string=eval(string);
               input.value=string;
              }
              
              else if(e.target.innerHTML == "AC"){
                      string="";
                      input.value=string;
              }
              else if(e.target.innerHTML == "DEL"){
                      string=string.substring(0,string.
                      length-1);
                      input.value=string;
              }
              else { 
               string+= e.target.innerHTML;
               input.value=string;
              }
              
       });
});
</script>


</body>
</html>
